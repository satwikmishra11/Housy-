name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: housy_user
          POSTGRES_PASSWORD: housy_password
          POSTGRES_DB: housy_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U housy_user -d housy_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        env:
          DATABASE_URL: postgres://housy_user:housy_password@localhost:5432/housy_db
          NODE_ENV: test
        run: npm test


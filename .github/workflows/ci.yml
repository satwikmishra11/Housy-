name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: housy_user
          POSTGRES_PASSWORD: housy_password
          POSTGRES_DB: housy_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U housy_user -d housy_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Local Secret Verification
        run: node scripts/scan-secrets.mjs

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@housy/shared

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Setup environment
        run: cp apps/api/.env.example apps/api/.env

      - name: Run database migrations
        env:
          DATABASE_URL: postgres://housy_user:housy_password@localhost:5432/housy_db
          NODE_ENV: test
          LLM_PROVIDER: mock
        run: npm run db:migrate

      - name: Seed test database
        env:
          DATABASE_URL: postgres://housy_user:housy_password@localhost:5432/housy_db
          NODE_ENV: test
          LLM_PROVIDER: mock
        run: npm run db:seed

      - name: Run tests
        env:
          DATABASE_URL: postgres://housy_user:housy_password@localhost:5432/housy_db
          NODE_ENV: test
          LLM_PROVIDER: mock
          TZ: Asia/Kolkata
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        env:
          DATABASE_URL: postgres://housy_user:housy_password@localhost:5432/housy_db
          NODE_ENV: test
          LLM_PROVIDER: mock
          PORT: 3001
          RATE_LIMIT_LOGIN_MAX: 1000
          RATE_LIMIT_LOGIN_WINDOW_MS: 60000
          RATE_LIMIT_GENERAL_MAX: 5000
          RATE_LIMIT_CHAT_MAX: 1000
        run: npm run test:e2e

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

